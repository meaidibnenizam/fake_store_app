name: fake_store_app
description: A Flutter app that consumes the Fake Store REST API to display a searchable product catalog.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 'http' package is used to send GET requests to the Fake Store API.
  http: ^1.2.0

  # 'cached_network_image' loads remote images and caches them on the device.
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
